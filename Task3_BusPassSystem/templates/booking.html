<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <title>Book Ticket — CloudBus</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; }
        body { font-family: 'Segoe UI', sans-serif; background: #f0f4f8; }
        header { background: linear-gradient(135deg, #1a73e8, #0d47a1); color: white; padding: 30px 40px; text-align: center; }
        header h1 { font-size: 2em; }
        nav { background: #0d47a1; padding: 12px 40px; display: flex; gap: 20px; }
        nav a { color: white; text-decoration: none; font-weight: 500; padding: 6px 16px; border-radius: 20px; }
        nav a:hover { background: rgba(255,255,255,0.2); }
        .container { max-width: 600px; margin: 50px auto; padding: 0 20px; }
        .card { background: white; border-radius: 12px; padding: 35px; box-shadow: 0 4px 15px rgba(0,0,0,0.08); }
        .route-summary { background: #e8f0fe; border-radius: 8px; padding: 20px; margin-bottom: 30px; }
        .route-title { font-size: 1.5em; font-weight: 700; color: #1a73e8; text-align: center; margin-bottom: 15px; }
        .route-details { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
        .detail { display: flex; flex-direction: column; }
        .detail-label { font-size: 0.8em; color: #888; }
        .detail-value { font-weight: 600; color: #333; }
        .price-badge { text-align: center; margin-top: 15px; font-size: 1.3em; font-weight: 700; color: #2e7d32; }
        h3 { color: #333; margin-bottom: 20px; font-size: 1.2em; }
        .form-group { margin-bottom: 20px; }
        label { display: block; margin-bottom: 6px; font-weight: 500; color: #555; }
        input { width: 100%; padding: 12px 15px; border: 2px solid #ddd; border-radius: 8px; font-size: 1em; transition: border-color 0.3s; }
        input:focus { outline: none; border-color: #1a73e8; }
        .submit-btn { width: 100%; padding: 14px; background: linear-gradient(135deg, #1a73e8, #0d47a1); color: white; border: none; border-radius: 8px; font-size: 1.1em; font-weight: 600; cursor: pointer; }
        .submit-btn:hover { opacity: 0.9; }
        .back-link { display: block; text-align: center; margin-top: 15px; color: #1a73e8; text-decoration: none; }
    </style>
</head>
<body>
    <header><h1>🎫 Book Your Ticket</h1></header>
    <nav>
        <a href="/">🏠 Home</a>
        <a href="/tickets">🎫 All Tickets</a>
    </nav>
    <div class="container">
        <div class="card">
            <div class="route-summary">
                <div class="route-title">{{ route.origin }} → {{ route.destination }}</div>
                <div class="route-details">
                    <div class="detail">
                        <span class="detail-label">🕐 Departure</span>
                        <span class="detail-value">{{ route.departure_time }}</span>
                    </div>
                    <div class="detail">
                        <span class="detail-label">🕐 Arrival</span>
                        <span class="detail-value">{{ route.arrival_time }}</span>
                    </div>
                    <div class="detail">
                        <span class="detail-label">💺 Available Seats</span>
                        <span class="detail-value">{{ route.available_seats }}</span>
                    </div>
                </div>
                <div class="price-badge">💰 {{ route.price }} DZD</div>
            </div>
            <h3>Passenger Information</h3>
            <form action="/confirm" method="POST">
                <input type="hidden" name="route_id" value="{{ route.id }}">
                <div class="form-group">
                    <label>Full Name</label>
                    <input type="text" name="name" placeholder="Ex: Hiba Bendimerad" required>
                </div>
                <div class="form-group">
                    <label>Email Address</label>
                    <input type="email" name="email" placeholder="Ex: hiba@email.com" required>
                </div>
                <button type="submit" class="submit-btn">🎫 Confirm Booking</button>
            </form>
            <a href="/" class="back-link">← Back to routes</a>
        </div>
    </div>
</body>
</html>
